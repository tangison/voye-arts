name: Fetch asset pack

on:
  push:
    paths:
      - ".github/workflows/fetch-assets.yml"

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Download pack from gofile
        run: |
          python3 - <<'PYEOF'
          import hashlib, json, re, sys, time, urllib.request

          UA = ("Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 "
                "(KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36")
          LANG = "en-US"
          CONTENT_ID = "aDTFEWDi"

          def req(url, headers=None, data=None, method=None):
              r = urllib.request.Request(url, data=data, headers=headers or {}, method=method)
              with urllib.request.urlopen(r, timeout=90) as resp:
                  return resp.read()

          base = {"User-Agent": UA, "Origin": "https://gofile.io", "Referer": "https://gofile.io/"}

          acct = json.loads(req("https://api.gofile.io/accounts",
                                headers={**base, "Content-Type": "application/json"},
                                data=b"{}", method="POST"))
          if acct.get("status") != "ok":
              sys.exit(f"guest account failed: {acct.get('status')}")
          token = acct["data"]["token"]
          print("guest account ok", flush=True)

          salts = ["12af056dacea0b"]
          try:
              js = req("https://gofile.io/dist/js/wt.obf.js", headers=base).decode("utf-8", "replace")
              for c in re.findall(r'["\']([0-9a-f]{12,16})["\']', js):
                  if c not in salts:
                      salts.append(c)
              print(f"wt.obf.js fetched, {len(salts)} salt candidates", flush=True)
          except Exception as e:
              print("wt.obf.js fetch failed:", e, flush=True)

          def contents(salt, offset):
              window = int(time.time() // 14400) + offset
              wt = hashlib.sha256(f"{UA}::{LANG}::{token}::{window}::{salt}".encode()).hexdigest()
              headers = {**base, "Authorization": "Bearer " + token, "X-Website-Token": wt,
                         "X-BL": LANG, "Accept": "*/*"}
              url = (f"https://api.gofile.io/contents/{CONTENT_ID}"
                     "?contentFilter=&page=1&pageSize=1000&sortField=createTime&sortDirection=-1")
              return json.loads(req(url, headers=headers))

          meta = None
          for salt in salts:
              for offset in (0, -1):
                  try:
                      data = contents(salt, offset)
                  except Exception as e:
                      print("request failed:", e, flush=True)
                      time.sleep(5)
                      continue
                  st = data.get("status")
                  print(f"salt={salt} offset={offset} -> {st}", flush=True)
                  if st == "ok":
                      meta = data
                      break
                  if st == "error-rateLimit":
                      time.sleep(15)
              if meta:
                  break

          if not meta:
              sys.exit("could not list contents")

          d = meta["data"]
          print("data keys:", sorted(d.keys()), "type:", d.get("type"), "name:", d.get("name"))
          if d.get("type") == "file" or d.get("link"):
              files = [d]
          else:
              children = d.get("children") or d.get("contents") or {}
              files = list(children.values()) if isinstance(children, dict) else list(children)
              files = [c for c in files if c.get("type") != "folder"]
          print(json.dumps([{k: c.get(k) for k in ("name", "type", "size", "link")} for c in files], indent=2))
          if not files:
              sys.exit("no files in share")
          f = files[0]
          blob = req(f["link"], headers={**base, "Cookie": "accountToken=" + token})
          with open(f["name"], "wb") as out:
              out.write(blob)
          print("downloaded", f["name"], len(blob), "bytes")
          PYEOF
          ls -la Voye_Startup_Pack.zip
          file Voye_Startup_Pack.zip

      - name: Extract pack
        run: |
          set -euo pipefail
          mkdir -p assets-inbox
          unzip -o "Voye_Startup_Pack.zip" -d assets-inbox
          echo "--- file listing ---"
          find assets-inbox -type f -exec ls -la {} +
          echo "--- total size ---"
          du -sh assets-inbox

      - name: Commit assets to branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets-inbox
          git commit -m "Add client asset pack (fetched from gofile)"
          git push origin HEAD:${{ github.ref_name }}
